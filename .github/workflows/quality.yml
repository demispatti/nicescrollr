name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.2', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

  wordpress-plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the distributable plugin
        run: |
          mkdir -p "${RUNNER_TEMP}/nicescrollr"
          rsync -rc --exclude-from=.distignore ./ "${RUNNER_TEMP}/nicescrollr/"
      - name: Run the official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/nicescrollr
